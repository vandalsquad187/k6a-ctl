# k6a-ctl v1.4.0 — EINZIGE Quelle der Wahrheit
# mode: gaming | daily   (manuell umschaltbar über WebUI /mode?m=…, sonst nichts)
mode=gaming
thermal_protect=on
game_pkg=com.activision.callofduty.shooter
debug=0

# ── delegation ──────────────────────────────────────────────────────────────
# 1=Kernel-Governor steuert thermal (CPU-Gold clamp, GPU-Cap, BW-Floors)
# 0=Legacy userspace-only (k6a-ctl setzt CPU/GPU Freqs direkt)
delegated=1

# profil: gaming | battery | badazz | badazz_safe | custom
# custom läuft mit den cd_thresholds unten (profile=custom lässt Kernel die
# Werte stehen, alle anderen Profile überschreiben sie)
profile=custom

# auto badazz_safe schwelltemperatur (°C) — greift nur bei profile=gaming
auto_badazz_temp=95
auto_badazz_hyst=5

# akku-schutz schwelle (°C, 35-60) — kernel battery_guard_temp
battery_guard_temp=45
battery_guard=on

# ── gold-cluster deckelung (Hz) ─────────────────────────────────────────────
# 0 = keine Deckelung, sonst nächstgelegene verfügbare OPP ≤ Ziel.
#
# Befund 2026-10 (COD Mobile, SD732G): die Last ist bandbreiten-/wärmelimitiert,
# nicht cpu-limitiert. Volle Taktrate (2304000) lieferte Ø 49,8 fps, weil der
# Speicher heiß wird und seine Timings drosselt. 1708800 (−26 %) hob das auf
# Ø 58,2 fps (+17 %) bei 20 °C niedrigerer Kerntemperatur. Darunter (1555200)
# wird die CPU rechenlimitiert und die Bildrate bricht auf Ø 50,5 zurück.
#
# gaming: Optimum für Bildrate
gold_cap_gaming=1708800
# daily:  sparsam; im Alltag unsichtbar, da nur die Lastspitze betroffen ist
gold_cap_daily=1555200

# ── schwellwerte ────────────────────────────────────────────────────────────
# Reihenfolge ist durch den Kernel fix: l2t l3t l4t rec l2g l3g l4g
# (rec zuerst schreiben ergibt -EINVAL und wird still abgelehnt).
# l2t/l3t/l4t in °C, rec = Rückfalltemperatur, l*g = Gold-Maxfrequenz (Hz).
# Beim Start neu angewendet, damit sie Reboot/Modul-Neustart überleben.
cd_thresholds=93 96 99 90 1708800 1555200 1324800
