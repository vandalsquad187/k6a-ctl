# k6a-ctl v1.1.0 — EINZIGE Quelle der Wahrheit
# mode: gaming | daily
mode=gaming
# thermal_protect: on | off
thermal_protect=on
game_pkg=com.activision.callofduty.shooter
debug=0

# ── delegation ──────────────────────────────────────────────────────────────
# 1=Kernel-Governor steuert thermal (CPU-Gold clamp, GPU-Cap, BW-Floors)
# 0=Legacy userspace-only (k6a-ctl setzt CPU/GPU Freqs direkt)
delegated=1

# profil: gaming | battery | badazz | badazz_safe
# gaming=volle Leistung, badazz_safe=defensiv ab 85°C
profile=gaming

# auto badazz_safe schwelltemperatur (°C)
# bei >= TEMP → automatisch wechsel zu badazz_safe
auto_badazz_temp=85
# hysteresis für Rückwechsel (°C), z.B. 5 = zurück bei 80°C
auto_badazz_hyst=5
# akku-schutz schwelle (°C, 35-60) — kernel battery_guard_temp (Build27+)
battery_guard_temp=45
