# k6a-ctl — EINZIGE Quelle der Wahrheit
# mode: gaming | daily | auto — auto: pidof + /proc/<pid>/cgroup top-app,
#       Hysterese 2 Ticks in / 10s raus. WebUI /mode?m=… schaltet manuell.
# Shipped-Default = auto (Neuinstallationen); bestehende Datei unverändert lassen.
mode=auto
thermal_protect=on
game_pkg=com.activision.callofduty.shooter
debug=0

# ── delegation ──────────────────────────────────────────────────────────────
# 1=Kernel-Governor steuert thermal (CPU-Gold clamp, GPU-Cap, BW-Floors)
# 0=Legacy userspace-only (k6a-ctl setzt CPU/GPU Freqs direkt)
delegated=1

# profil: gaming | battery | badazz | badazz_safe | custom
# custom läuft mit den cd_thresholds unten (profile=custom lässt Kernel die
# Werte stehen, alle anderen Profile überschreiben sie)
profile=custom

# auto badazz_safe schwelltemperatur (°C) — greift nur bei profile=gaming
auto_badazz_temp=95
auto_badazz_hyst=5

# akku-schutz schwelle (°C, 35-60) — kernel battery_guard_temp
battery_guard_temp=45
battery_guard=on

# ── gold-cluster deckelung (Hz) ─────────────────────────────────────────────
# 0 = keine Deckelung, sonst nächstgelegene verfügbare OPP ≤ Ziel.
#
# Befund 2026-10 (COD Mobile, SD732G): die Last ist bandbreiten-/wärmelimitiert,
# nicht cpu-limitiert. Volle Taktrate (2304000) lieferte Ø 49,8 fps, weil der
# Speicher heiß wird und seine Timings drosselt. 1708800 (−26 %) hob das auf
# Ø 58,2 fps (+17 %) bei 20 °C niedrigerer Kerntemperatur. Darunter (1555200)
# wird die CPU rechenlimitiert und die Bildrate bricht auf Ø 50,5 zurück.
#
# gaming: Kappe bleibt als Profil-Deckel — bis die build352-A/B-Kontrolle
# (gold_cap_gaming 0 vs 1708800, 3 Runden je) den Vorzug festlegt. Vor dem
# Schwellenfund (2026-10-18) überwog die Kappe klar; die r52–r54-Läufe
# (Schwellen 96/99/102, uncapped) verschieben den Vorteil zu "frei".
gold_cap_gaming=1708800
# daily:  sparsam; im Alltag unsichtbar, da nur die Lastspitze betroffen ist
gold_cap_daily=1555200

# ── schwellwerte ────────────────────────────────────────────────────────────
# Reihenfolge ist durch den Kernel fix: l2t l3t l4t rec l2g l3g l4g
# (rec zuerst schreiben ergibt -EINVAL und wird still abgelehnt).
# l2t/l3t/l4t in °C, rec = Rückfalltemperatur, l*g = Gold-Maxfrequenz (Hz).
#
# SHIPPED-WERT (hier, README, module.prop) = user-tuned D1, R2-Validierung
# 2026-11-19: 72/80/87/66 — R2 lief damit (L4 0 s, 1/1500 ≥86 °C).
# Der Kernel-GAMING-Profil-Default (build352+) bleibt 96/99/102/93 und greift
# nur, wenn dieser Key in settings.conf FEHLT (profile=custom behält die Werte
# hier; alle anderen Profile überschreiben sie kernelseitig).
# Historie: mit 93/96/99 fielen Runden 20–39 % in cd_l2; 96/99/102/93 war der
# erste user-tuned Satz, 72/80/87/66 die D1-Kalibrierung (Vendor-Engine-
# Überholung braucht niedrigere Schwellen, s. r9/r9b im Devlog).
cd_thresholds=72 80 87 66 1708800 1555200 1324800

# ── silver-cluster deckelung (Hz, v1.4.2) ───────────────────────────────────
# policy0 (Silver) während GAMING; 0 = unverändert (Boot-Max).
# Kernel snapt auf die OPP-Tabelle. Restore: beim Verlassen des Gaming-State.
silver_cap_gaming=0

# ── gpu deckelung (Hz, v1.4.2) ──────────────────────────────────────────────
# kgsl-3d0 devfreq/max_freq + kgsl(max_gpuclk) während GAMING; 0 = unverändert
# (kgsl Boot-Max, auf sweet 800000000). Kernel snapt auf gpu_available_frequencies.
# Restore: beim Verlassen des Gaming-State. mi_thermald besitzt das cooling
# device thermal-devfreq-0 — bei Spielbeginn schreiben wir NACH dessen Init und
# reimpact provis only on state changes (ident. wie gold_cap).
# Experimenthinweis (sweet, CODM): 700000000 senkt tp von ~95 auf ~80 °C bei
# kaum fps-Verlust (CPU-limitiert — wie früher r58 bestätigt).
gpu_cap_gaming=0

# ── kernel gpu caps + adaptive poll (v1.6.6) ─────────────────────────────────
# Beides flüchtige k6a_gov-Sysfs-Nodes (Reboot → Kernel-Defaults 800/565/430
# bzw. adaptive=1); dieses Modul re-appliziert beide beim Start, wenn gesetzt.
# gpu_caps = 3 Hz-Werte für die CD-Zustände L2/L3/L4 (k6a_gov gpu_caps-Node,
# ab Kernel Build 452). Leer = Kernel-Default. poll_adaptive: 1 = Adaptive
# Slow-Poll (GAMING weit unter cd_l2_temp → 1 Hz, +3 K-Steig-Reset), 0 = immer
# poll_ms; leer = Kernel-Default (1). D1-Arming (r14): 800/680/500 + 0.
gpu_caps=800000000 680000000 500000000
poll_adaptive=0

# ── kernel feinleiter + silver caps (v1.6.8) ────────────────────────────────
# Beides flüchtige k6a_gov-Sysfs-Nodes (Reboot → Kernel-Defaults); dieses
# Modul re-appliziert beide beim Start, wenn gesetzt (idempotent wie gpu_caps,
# alte Kernel ohne Node failen still). Profile clobbern die Nodes nicht.
# cd_ladder (ab Kernel Build 461): 1 = Feinleiter an — Gold-Cap piecewise-
#   linear interpoliert l2g@l2t → l3g@l3t → l4g@l4t (Build461-Default);
#   0 = flaches Build459-Verhalten (A/B ohne Reflash). Leer = Kernel-Default.
cd_ladder=1
# cd_silver_caps (ab Kernel Build 460): 3 Hz-Werte L2/L3/L4 für Silver
#   (CPU-0) im CD-Pfad, `0 0 0` = aus (Kernel-Default). Reihenfolge wie
#   gpu_caps, Validierung l2≥l3≥l4 + all-or-none-0 (Kernel-Store-Spiegel).
cd_silver_caps=0 0 0
