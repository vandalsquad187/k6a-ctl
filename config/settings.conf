# k6a-ctl — EINZIGE Quelle der Wahrheit
# mode: gaming | daily
mode=gaming
# thermal_protect: on | off
thermal_protect=on
game_pkg=com.activision.callofduty.shooter
debug=0

# Cooldown-Schwellen (°C)
cd_l2_temp=88
cd_l3_temp=92
cd_l4_temp=95
cd_recover=80
hysteresis_fast=3
hysteresis_normal=10

# Cooldown-Frequenzen als Prozent des je-Gerät-Maximums
cd_l2_gold_pct=90
cd_l3_gold_pct=70
cd_l4_gold_pct=58
cd_l2_gpu_pct=70
cd_l3_gpu_pct=44
cd_l4_gpu_pct=33
